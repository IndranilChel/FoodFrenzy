<!DOCTYPE html>
<html lang="en"
	  xmlns:th="http://www.thymeleaf.org">

<head>

	<meta charset="UTF-8">

	<meta name="viewport"
		  content="width=device-width, initial-scale=1.0">

	<title>FoodFrenzy - Add Product</title>

	<link rel="icon"
		  th:href="@{/images/logo.png}">

	<link rel="stylesheet"
		  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

	<link rel="stylesheet"
		  th:href="@{/css/Add_Product.css}">

</head>


<body>


<!-- =====================================================
     BACK BUTTON
===================================================== -->

<a th:href="@{/admin/services}"
   class="back-button">

	<i class="fa-solid fa-arrow-left"></i>

	Back to Services

</a>



<!-- =====================================================
     MAIN PAGE
===================================================== -->

<div class="page-wrapper">


	<!-- =================================================
         LEFT INFO PANEL
    ================================================== -->

	<div class="info-panel">

		<div class="brand">

			<img th:src="@{/images/logo.png}"
				 alt="FoodFrenzy Logo">

			<h1>
				FoodFrenzy
			</h1>

		</div>


		<h2>
			Add a New Product
		</h2>


		<p>

			Add a delicious new item to your FoodFrenzy
			menu and make it available for customers.

		</p>


		<div class="info-list">


			<div class="info-item">

				<i class="fa-solid fa-utensils"></i>

				<span>
                    Add food item details
                </span>

			</div>


			<div class="info-item">

				<i class="fa-solid fa-image"></i>

				<span>
                    Set the product image
                </span>

			</div>


			<div class="info-item">

				<i class="fa-solid fa-tags"></i>

				<span>
                    Select a food category
                </span>

			</div>


		</div>

	</div>



	<!-- =================================================
         FORM CARD
    ================================================== -->

	<div class="form-card">


		<div class="form-header">

			<div class="form-icon">

				<i class="fa-solid fa-circle-plus"></i>

			</div>


			<div>

				<h2>
					Add Product
				</h2>

				<p>
					Enter the product information below
				</p>

			</div>

		</div>



		<form th:action="@{/addingProduct}"
			  method="post">


			<!-- =========================================
                 PRODUCT NAME
            ========================================== -->

			<div class="form-group">

				<label for="pname">

					<i class="fa-solid fa-bowl-food"></i>

					Product Name

				</label>


				<input type="text"
					   id="pname"
					   name="pname"
					   placeholder="e.g. Special Pasta"
					   required>

			</div>



			<!-- =========================================
                 PRODUCT PRICE
            ========================================== -->

			<div class="form-group">

				<label for="pprice">

					<i class="fa-solid fa-indian-rupee-sign"></i>

					Product Price

				</label>


				<div class="input-icon">

					<span>₹</span>

					<input type="number"
						   id="pprice"
						   name="pprice"
						   placeholder="e.g. 165"
						   min="0"
						   step="0.01"
						   required>

				</div>

			</div>



			<!-- =========================================
                 PRODUCT IMAGE PATH
            ========================================== -->

			<div class="form-group">

				<label for="pimage">

					<i class="fa-solid fa-image"></i>

					Product Image

				</label>


				<input type="text"
					   id="pimage"
					   name="pimage"
					   placeholder="e.g. /images/products/pasta.jpg"
					   required>


				<small>

					Example:
					<strong>/images/products/pasta.jpg</strong>

				</small>

			</div>



			<!-- =========================================
                 PRODUCT CATEGORY
            ========================================== -->

			<div class="form-group">

				<label for="pcategory">

					<i class="fa-solid fa-tags"></i>

					Product Category

				</label>


				<select id="pcategory"
						name="pcategory"
						required>

					<option value="">
						Select Category
					</option>

					<option value="Pizza">
						Pizza
					</option>

					<option value="Burger">
						Burger
					</option>

					<option value="Biryani">
						Biryani
					</option>

					<option value="Pasta">
						Pasta
					</option>

					<option value="Chicken">
						Chicken
					</option>

					<option value="Drinks">
						Drinks
					</option>

					<option value="Dessert">
						Dessert
					</option>

					<option value="Other">
						Other
					</option>

				</select>

			</div>



			<!-- =========================================
                 BUTTONS
            ========================================== -->

			<div class="form-actions">


				<a th:href="@{/admin/services}"
				   class="cancel-button">

					<i class="fa-solid fa-xmark"></i>

					Cancel

				</a>


				<button type="submit"
						class="submit-button">

					<i class="fa-solid fa-plus"></i>

					Add Product

				</button>


			</div>


		</form>

	</div>

</div>


</body>

</html>
