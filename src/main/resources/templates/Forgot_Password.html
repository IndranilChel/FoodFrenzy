<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password | FoodFrenzy</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet"
          th:href="@{/css/Forgot_Password.css}">

</head>

<body>

<a th:href="@{/login}"
   class="back-button">

    <i class="fa-solid fa-arrow-left"></i>

    Back to Login

</a>


<main class="forgot-page">

    <div class="forgot-card">

        <div class="forgot-icon">

            <i class="fa-solid fa-key"></i>

        </div>


        <span class="small-title">
            ACCOUNT RECOVERY
        </span>


        <h1>
            Reset Password
        </h1>


        <p>
            Enter your registered email and create
            a new password for your FoodFrenzy account.
        </p>


        <!-- SUCCESS / ERROR MESSAGE -->

        <p class="reset-message"
           th:if="${message}"
           th:text="${message}">
        </p>


        <!-- RESET FORM -->

        <form th:action="@{/forgot-password}"
              method="post">


            <!-- EMAIL -->

            <label for="email">
                Registered Email
            </label>

            <div class="input-box">

                <i class="fa-solid fa-envelope"></i>

                <input type="email"
                       id="email"
                       name="email"
                       placeholder="Enter your registered email"
                       required>

            </div>


            <!-- NEW PASSWORD -->

            <label for="newPassword">
                New Password
            </label>

            <div class="input-box password-input">

                <i class="fa-solid fa-lock"></i>

                <input type="password"
                       id="newPassword"
                       name="newPassword"
                       placeholder="Create a new password"
                       required>

                <button type="button"
                        class="password-toggle"
                        onclick="togglePassword('newPassword', 'newPasswordIcon')">

                    <i class="fa-solid fa-eye"
                       id="newPasswordIcon"></i>

                </button>

            </div>


            <!-- CONFIRM PASSWORD -->

            <label for="confirmPassword">
                Confirm Password
            </label>

            <div class="input-box password-input">

                <i class="fa-solid fa-lock"></i>

                <input type="password"
                       id="confirmPassword"
                       name="confirmPassword"
                       placeholder="Confirm your new password"
                       required>

                <button type="button"
                        class="password-toggle"
                        onclick="togglePassword('confirmPassword', 'confirmPasswordIcon')">

                    <i class="fa-solid fa-eye"
                       id="confirmPasswordIcon"></i>

                </button>

            </div>


            <!-- BUTTON -->

            <button type="submit">

                <i class="fa-solid fa-key"></i>

                Update Password

            </button>

        </form>


        <!-- LOGIN -->

        <div class="login-link">

            Remember your password?

            <a th:href="@{/login}">
                Login Here
            </a>

        </div>

    </div>

</main>

<script>

    function togglePassword(passwordId, iconId) {

        const password =
            document.getElementById(passwordId);

        const icon =
            document.getElementById(iconId);

        if (password.type === "password") {

            password.type = "text";

            icon.classList.remove("fa-eye");

            icon.classList.add("fa-eye-slash");

        } else {

            password.type = "password";

            icon.classList.remove("fa-eye-slash");

            icon.classList.add("fa-eye");

        }

    }

</script>

</body>

</html>
