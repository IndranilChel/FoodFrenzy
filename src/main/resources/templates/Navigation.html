<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
</head>

<body>

<nav class="navbar" th:fragment="navbar()">

    <!-- =========================
         LOGO
    ========================== -->

    <a th:href="@{/}" class="nav-logo">

        <img th:src="@{/images/logo.png}"
             alt="FoodFrenzy Logo"
             class="logo">

        <span class="brand-name">
            FoodFrenzy
        </span>

    </a>


    <!-- =========================
         MOBILE MENU BUTTON
    ========================== -->

    <button type="button"
            class="mobile-menu-btn"
            id="mobileMenuButton"
            aria-label="Open navigation menu"
            aria-expanded="false">

        ☰

    </button>


    <!-- =========================
         NAVIGATION LINKS
    ========================== -->

    <ul class="nav-links" id="mobileNavLinks">

        <li>
            <a th:href="@{/}">
                Home
            </a>
        </li>

        <li>
            <a th:href="@{/products}">
                Menu
            </a>
        </li>

        <li>
            <a th:href="@{/about}">
                About
            </a>
        </li>

        <li>
            <a th:href="@{/location}">
                Location
            </a>
        </li>

    </ul>


    <!-- =========================
         RIGHT SIDE
    ========================== -->

    <div class="nav-right">

        <!-- GUEST -->

        <div th:if="${session.loggedInUser == null}"
             class="guest-nav">

            <a th:href="@{/login}"
               class="login-btn">

                Login

            </a>

            <a th:href="@{/products}"
               class="order-btn">

                Order Now

            </a>

        </div>


        <!-- LOGGED IN -->

        <div th:if="${session.loggedInUser != null}"
             class="logged-user-nav">

            <a th:if="${page == 'cart'}"
               th:href="@{/products}"
               class="nav-back-btn">

                <i class="fa-solid fa-arrow-left"></i>
                Back

            </a>


            <a th:href="@{/profile}"
               class="profile-btn">

                <i class="fa-solid fa-user"></i>
                Profile

            </a>


            <a th:href="@{/cart}"
               class="cart-btn">

                <i class="fa-solid fa-cart-shopping"></i>
                Cart

            </a>


            <a th:href="@{/logout}"
               class="logout-btn">

                <i class="fa-solid fa-right-from-bracket"></i>
                Logout

            </a>

        </div>

    </div>


    <!-- =========================
         MOBILE MENU SCRIPT
    ========================== -->

    <script th:inline="javascript">

        document.addEventListener("DOMContentLoaded", function () {

            const button =
                document.getElementById("mobileMenuButton");

            const menu =
                document.getElementById("mobileNavLinks");


            if (!button || !menu) {
                return;
            }


            button.addEventListener("click", function () {

                const isOpen =
                    menu.classList.toggle("mobile-open");

                button.setAttribute(
                    "aria-expanded",
                    isOpen ? "true" : "false"
                );

                button.setAttribute(
                    "aria-label",
                    isOpen
                        ? "Close navigation menu"
                        : "Open navigation menu"
                );

            });

        });

    </script>

</nav>

</body>
</html>
