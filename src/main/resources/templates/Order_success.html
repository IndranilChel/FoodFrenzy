<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

	<meta charset="UTF-8">

	<title>Order Successful</title>

	<link rel="stylesheet" th:href="@{/css/Navigation.css}">

	<style>

		*{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            font-family:'Poppins',sans-serif;

            background:#f5f5f5;

        }

        .success-container{

            width:100%;

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

        }

        .success-card{

            background:white;

            width:600px;

            padding:50px;

            text-align:center;

            border-radius:20px;

            box-shadow:0 15px 40px rgba(0,0,0,.12);

        }

        .success-icon{

            font-size:80px;

            color:#28a745;

            margin-bottom:20px;

        }

        h1{

            color:#28a745;

            margin-bottom:15px;

        }

        p{

            color:#666;

            font-size:18px;

            line-height:1.7;

            margin-bottom:35px;

        }

        .btn{

            display:inline-block;

            text-decoration:none;

            background:#ff6b35;

            color:white;

            padding:15px 35px;

            border-radius:40px;

            font-weight:bold;

            transition:.3s;

        }

        .btn:hover{

            background:#ff874d;

        }

	</style>

</head>

<body>

<div th:replace="~{Navigation :: navbar}"></div>

<div class="success-container">

	<div class="success-card">

		<div class="success-icon">
			✅
		</div>

		<h1>Order Placed Successfully!</h1>

		<p>

			Thank you for choosing <strong>FoodFrenzy</strong>.

			Your order has been received successfully and will be prepared shortly.

		</p>

		<a th:href="@{/products}" class="btn">

			Continue Shopping

		</a>

	</div>

</div>

</body>

</html>
