<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FoodFrenzy - Checkout</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Navigation CSS -->
    <link rel="stylesheet"
          th:href="@{/css/Navigation.css}">


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f6f8;
            color: #222;
        }


        /* =====================================================
           CHECKOUT HEADER
        ===================================================== */

        .checkout-header {
            text-align: center;
            padding: 45px 20px 25px;
        }

        .checkout-header h1 {
            font-size: 38px;
            margin-bottom: 10px;
            color: #222;
        }

        .checkout-header h1 span {
            color: #ff9800;
        }

        .checkout-header p {
            color: #777;
            font-size: 16px;
        }


        /* =====================================================
           MAIN CONTAINER
        ===================================================== */

        .checkout-container {
            width: 92%;
            max-width: 1200px;
            margin: 0 auto 50px;

            display: grid;
            grid-template-columns: 1.5fr 1fr;

            gap: 30px;
            align-items: start;
        }


        /* =====================================================
           LEFT SECTION
        ===================================================== */

        .checkout-card {
            background: white;
            border-radius: 18px;
            padding: 28px;

            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 12px;

            margin-bottom: 25px;
        }

        .card-title i {
            color: #ff9800;
            font-size: 24px;
        }

        .card-title h2 {
            font-size: 24px;
        }


        /* =====================================================
           USER INFORMATION
        ===================================================== */

        .user-info {
            background: #fff7e8;
            border: 1px solid #ffe0a3;

            padding: 18px;
            border-radius: 12px;

            margin-bottom: 25px;
        }

        .user-info h3 {
            margin-bottom: 12px;
            color: #333;
        }

        .user-info p {
            margin: 6px 0;
            color: #555;
        }

        .user-info i {
            color: #ff9800;
            width: 22px;
        }


        /* =====================================================
           CART ITEMS
        ===================================================== */

        .checkout-item {
            display: flex;
            align-items: center;

            gap: 18px;

            padding: 18px 0;

            border-bottom: 1px solid #eee;
        }

        .checkout-item:last-child {
            border-bottom: none;
        }

        .checkout-item img {
            width: 90px;
            height: 90px;

            object-fit: cover;

            border-radius: 12px;
        }

        .item-details {
            flex: 1;
        }

        .item-details h3 {
            font-size: 18px;
            margin-bottom: 7px;
        }

        .item-details p {
            color: #777;
            margin: 4px 0;
        }

        .item-price {
            font-size: 18px;
            font-weight: bold;
            color: #ff9800;
        }


        /* =====================================================
           RIGHT ORDER SUMMARY
        ===================================================== */

        .summary-card {
            background: white;

            border-radius: 18px;

            padding: 28px;

            box-shadow: 0 8px 25px rgba(0,0,0,0.08);

            position: sticky;
            top: 25px;
        }

        .summary-title {
            display: flex;
            align-items: center;

            gap: 12px;

            margin-bottom: 25px;
        }

        .summary-title i {
            color: #ff9800;
            font-size: 24px;
        }

        .summary-title h2 {
            font-size: 24px;
        }


        /* =====================================================
           SUMMARY ROWS
        ===================================================== */

        .summary-row {
            display: flex;
            justify-content: space-between;

            padding: 14px 0;

            border-bottom: 1px solid #eee;

            color: #555;
        }

        .summary-row strong {
            color: #222;
        }


        .total-row {
            display: flex;
            justify-content: space-between;

            padding: 22px 0;

            font-size: 22px;
            font-weight: bold;
        }

        .total-price {
            color: #ff9800;
        }


        /* =====================================================
           PAYMENT
        ===================================================== */

        .payment-section {
            margin-top: 10px;
        }

        .payment-section label {
            display: block;

            margin-bottom: 10px;

            font-weight: bold;
        }

        .payment-select {
            width: 100%;

            padding: 13px;

            border: 1px solid #ddd;
            border-radius: 10px;

            font-size: 15px;

            background: white;
        }


        /* =====================================================
           PLACE ORDER BUTTON
        ===================================================== */

        .place-order-btn {
            width: 100%;

            margin-top: 22px;

            padding: 15px;

            border: none;
            border-radius: 10px;

            background: #ff9800;
            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .place-order-btn:hover {
            background: #f57c00;

            transform: translateY(-2px);
        }


        /* =====================================================
           BACK TO CART
        ===================================================== */

        .back-cart {
            display: block;

            text-align: center;

            margin-top: 15px;

            padding: 13px;

            border: 2px solid #ff9800;

            border-radius: 10px;

            color: #ff9800;

            text-decoration: none;

            font-weight: bold;

            transition: 0.3s;
        }

        .back-cart:hover {
            background: #ff9800;
            color: white;
        }


        /* =====================================================
           EMPTY CHECKOUT
        ===================================================== */

        .empty-message {
            text-align: center;

            padding: 40px;

            color: #777;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 850px) {

            .checkout-container {
                grid-template-columns: 1fr;
            }

            .summary-card {
                position: static;
            }

        }


        @media (max-width: 600px) {

            .checkout-header h1 {
                font-size: 30px;
            }

            .checkout-card,
            .summary-card {
                padding: 20px;
            }

            .checkout-item img {
                width: 70px;
                height: 70px;
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     NAVIGATION
===================================================== -->

<div th:replace="~{Navigation :: navbar}"></div>


<!-- =====================================================
     HEADER
===================================================== -->

<section class="checkout-header">

    <h1>
        Complete Your <span>Order</span>
    </h1>

    <p>
        Review your order and confirm your purchase.
    </p>

</section>



<!-- =====================================================
     CHECKOUT CONTAINER
===================================================== -->

<div class="checkout-container">


    <!-- =================================================
         LEFT CARD
    ================================================== -->

    <div class="checkout-card">


        <div class="card-title">

            <i class="fa-solid fa-bag-shopping"></i>

            <h2>
                Order Details
            </h2>

        </div>


        <!-- USER INFORMATION -->

        <div class="user-info">

            <h3>
                <i class="fa-solid fa-user"></i>
                Customer Information
            </h3>

            <p>
                <i class="fa-solid fa-user"></i>

                <strong>Name:</strong>

                <span th:text="${user.uname}">
                    Customer
                </span>
            </p>

            <p>
                <i class="fa-solid fa-envelope"></i>

                <strong>Email:</strong>

                <span th:text="${user.uemail}">
                    customer@email.com
                </span>
            </p>

            <p>
                <i class="fa-solid fa-phone"></i>

                <strong>Phone:</strong>

                <span th:text="${user.unumber}">
                    0000000000
                </span>
            </p>

        </div>



        <!-- =================================================
             CART ITEMS
        ================================================== -->

        <div th:if="${cartItems != null and !cartItems.isEmpty()}">

            <div class="checkout-item"
                 th:each="item : ${cartItems}">


                <!-- PRODUCT IMAGE -->

                <img th:src="@{${item.productImage}}"
                     th:alt="${item.productName}">


                <!-- PRODUCT DETAILS -->

                <div class="item-details">

                    <h3 th:text="${item.productName}">
                        Product Name
                    </h3>

                    <p>
                        Price:
                        ₹
                        <span th:text="${item.productPrice}">
                            0
                        </span>
                    </p>

                    <p>
                        Quantity:
                        <strong th:text="${item.quantity}">
                            1
                        </strong>
                    </p>

                </div>


                <!-- TOTAL -->

                <div class="item-price">

                    ₹
                    <span th:text="${item.totalPrice}">
                        0
                    </span>

                </div>


            </div>

        </div>


        <!-- EMPTY -->

        <div class="empty-message"
             th:if="${cartItems == null or cartItems.isEmpty()}">

            <i class="fa-solid fa-cart-shopping"
               style="font-size:40px;color:#ff9800;">
            </i>

            <p>
                Your cart is empty.
            </p>

        </div>


    </div>



    <!-- =================================================
         RIGHT SUMMARY
    ================================================== -->

    <div class="summary-card">


        <div class="summary-title">

            <i class="fa-solid fa-receipt"></i>

            <h2>
                Order Summary
            </h2>

        </div>


        <!-- ITEM COUNT -->

        <div class="summary-row">

            <span>
                Items
            </span>

            <strong
                    th:text="${cartItems != null ? cartItems.size() : 0}">
                0
            </strong>

        </div>


        <!-- DELIVERY -->

        <div class="summary-row">

            <span>
                Delivery
            </span>

            <strong>
                Free
            </strong>

        </div>


        <!-- TOTAL -->

        <div class="total-row">

            <span>
                Grand Total
            </span>

            <span class="total-price">

                ₹
                <span th:text="${grandTotal}">
                    0
                </span>

            </span>

        </div>


        <!-- =================================================
             PAYMENT FORM
        ================================================== -->

        <form th:action="@{/checkout/placeOrder}"
              method="post">


            <div class="payment-section">

                <label for="payment">

                    <i class="fa-solid fa-credit-card"></i>

                    Payment Method

                </label>


                <select id="payment"
                        name="payment"
                        class="payment-select">

                    <option value="COD">
                        Cash On Delivery
                    </option>

                </select>

            </div>


            <!-- PLACE ORDER -->

            <button type="submit"
                    class="place-order-btn">

                <i class="fa-solid fa-check"></i>

                Place Order

            </button>


        </form>


        <!-- BACK TO CART -->

        <a th:href="@{/cart}"
           class="back-cart">

            <i class="fa-solid fa-arrow-left"></i>

            Back to Cart

        </a>


    </div>


</div>


</body>

</html>
